name: release

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  publish:
    name: Build, Push, Sign & Promote to GitOps
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      tag: sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/eka-research/research-redis
          tags: |
            type=sha,prefix=sha-,format=long
            type=raw,value=latest

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: api
          push: true
          sbom: true
          provenance: mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign image keyless (Sigstore OIDC)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: cosign sign --yes ghcr.io/eka-research/research-redis@${{ steps.build.outputs.digest }}

  promote-gitops:
    name: Open PR in research-redis-gitops
    needs: publish
    runs-on: ubuntu-latest
    # Runs only once vars.GITOPS_APP_ID and secrets.GITOPS_APP_PRIVATE_KEY are configured.
    if: ${{ vars.GITOPS_APP_ID != '' }}
    permissions:
      contents: read
    steps:
      - name: Mint short-lived GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.GITOPS_APP_ID }}
          private-key: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
          owner: eka-research
          repositories: research-redis-gitops

      - name: Checkout gitops repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: eka-research/research-redis-gitops
          token: ${{ steps.app-token.outputs.token }}

      - name: Install standalone kustomize v5.8.3
        run: |
          curl -fsSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.8.3/kustomize_v5.8.3_linux_amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin kustomize

      - name: Bump API image tag in kind overlay
        working-directory: apps/api/overlays/kind
        run: |
          kustomize edit set image "research-redis=ghcr.io/eka-research/research-redis:${{ needs.publish.outputs.tag }}"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          commit-message: "chore(api): bump image to ${{ needs.publish.outputs.tag }}"
          branch: promote/api-${{ needs.publish.outputs.tag }}
          title: "chore(api): promote ${{ needs.publish.outputs.tag }} to kind"
          body: |
            Automated promotion from `eka-research/research-redis@${{ github.sha }}`.
            - Image: `ghcr.io/eka-research/research-redis:${{ needs.publish.outputs.tag }}`
            - Digest: `${{ needs.publish.outputs.digest }}`
